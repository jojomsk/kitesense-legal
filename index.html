<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Политика конфиденциальности — KiteSense</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; line-height: 1.5; color: #222; }
  h1 { border-bottom: 2px solid #ccc; padding-bottom: .3em; }
  h2 { margin-top: 1.5em; }
  .lang-switch { margin: 1em 0; }
  .lang-switch button { padding: .4em 1em; margin-right: .5em; cursor: pointer; border: 1px solid #999; background: #f5f5f5; border-radius: 4px; }
  .lang-switch button.active { background: #0077cc; color: #fff; border-color: #0077cc; }
  .updated { color: #666; font-size: .9em; }
  a { color: #0077cc; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="lang-switch">
  <button id="btn-ru" class="active" onclick="setLang('ru')">Русский</button>
  <button id="btn-en" onclick="setLang('en')">English</button>
</div>

<!-- ================= RU ================= -->
<div id="lang-ru">
<h1>Политика конфиденциальности</h1>
<p class="updated">Последнее обновление: 27 октября 2026 г.</p>
<p><em>Текст политики будет вставлен следующим шагом (берётся из strings.xml, ключ privacy_body).</em></p>
</div>

<!-- ================= EN ================= -->
<div id="lang-en" hidden>
<h1>Privacy Policy</h1>
<p class="updated">Last updated: October 27, 2026</p>
<p><em>The policy text will be inserted in the next step (from strings.xml, key privacy_body).</em></p>
</div>

<script>
function setLang(lang) {
  document.getElementById('lang-ru').hidden = (lang !== 'ru');
  document.getElementById('lang-en').hidden = (lang !== 'en');
  document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
}
</script>

</body>
</html>
